<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>Trick3 手机控制原型</title>
    <style>
      :root {
        color-scheme: dark;
        --cyan: #38d9ff;
        --panel: rgba(8, 20, 34, 0.82);
        --line: rgba(148, 210, 235, 0.22);
        --text: #eef9ff;
        --muted: #94adba;
        --danger: #ff5264;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #07101b;
        color: var(--text);
        font-family: Inter, "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      .app {
        position: relative;
        width: min(100vw, 430px);
        height: 100dvh;
        min-height: 620px;
        margin: 0 auto;
        background: radial-gradient(
          circle at 52% 35%,
          #30566b 0,
          #173342 28%,
          #081621 68%
        );
        box-shadow: 0 0 80px #000b;
      }
      .camera {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(3, 9, 15, 0.04), rgba(3, 9, 15, 0.35)),
          repeating-linear-gradient(
            90deg,
            transparent 0 79px,
            rgba(255, 255, 255, 0.018) 80px
          );
      }
      .road {
        position: absolute;
        left: 16%;
        right: 16%;
        bottom: 16%;
        height: 48%;
        clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
        background: linear-gradient(
          180deg,
          rgba(98, 122, 128, 0.12),
          rgba(100, 125, 132, 0.42)
        );
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }
      .road:after {
        content: "";
        position: absolute;
        left: 49%;
        top: 10%;
        width: 2%;
        height: 82%;
        background: repeating-linear-gradient(
          #d9edf2 0 28px,
          transparent 28px 52px
        );
        opacity: 0.45;
      }
      header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
        background: linear-gradient(#06111de8, transparent);
        z-index: 5;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .live {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #b8f6cf;
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #35e683;
        box-shadow: 0 0 12px #35e683;
      }
      #settings-toggle {
        display: none;
      }
      .gear {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: rgba(3, 13, 22, 0.72);
        font-size: 22px;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }
      .settings {
        position: absolute;
        top: 72px;
        right: 14px;
        width: min(310px, calc(100vw - 28px));
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 18px 50px #0008;
        backdrop-filter: blur(18px);
        z-index: 8;
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
        pointer-events: none;
        transition: 0.2s;
      }
      #settings-toggle:checked ~ .settings {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .settings h2 {
        margin: 0 0 14px;
        font-size: 16px;
      }
      .field {
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: center;
        gap: 10px;
        margin: 12px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .field select,
      .field input[type="range"] {
        width: 100%;
      }
      .field select {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #0a1926;
        color: var(--text);
      }
      .switches {
        display: flex;
        gap: 8px;
      }
      .chip {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #0a1926;
        color: #c8dbe4;
        font-size: 12px;
      }
      .joystick {
        position: absolute;
        left: 24px;
        bottom: 112px;
        width: 150px;
        height: 150px;
        border: 1px solid rgba(126, 219, 255, 0.35);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(56, 217, 255, 0.13),
          rgba(5, 18, 29, 0.42) 65%
        );
        box-shadow: inset 0 0 34px rgba(56, 217, 255, 0.08);
        z-index: 4;
      }
      .joystick:before,
      .joystick:after {
        content: "";
        position: absolute;
        background: rgba(156, 224, 244, 0.18);
      }
      .joystick:before {
        left: 50%;
        top: 9%;
        bottom: 9%;
        width: 1px;
      }
      .joystick:after {
        top: 50%;
        left: 9%;
        right: 9%;
        height: 1px;
      }
      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 58px;
        height: 58px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(145deg, #49e0ff, #158bb8);
        box-shadow:
          0 8px 24px #001b2b,
          0 0 20px #38d9ff55;
        border: 2px solid #b4f2ff;
      }
      .telemetry {
        position: absolute;
        right: 18px;
        bottom: 126px;
        text-align: right;
        z-index: 4;
      }
      .value {
        font: 700 36px/1 monospace;
        color: #fff;
      }
      .unit {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.16em;
      }
      .steer {
        margin-top: 16px;
        color: #94adba;
        font-size: 12px;
      }
      .steer b {
        display: block;
        color: var(--cyan);
        font: 700 25px/1.2 monospace;
      }
      .bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: 1fr 104px;
        gap: 12px;
        background: linear-gradient(transparent, #06111d 35%);
        z-index: 5;
      }
      .status {
        align-self: end;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(6, 18, 29, 0.7);
        font-size: 12px;
        color: var(--muted);
      }
      .status strong {
        display: block;
        color: #e9f9ff;
        font-size: 14px;
        margin-bottom: 3px;
      }
      .stop {
        border: 0;
        border-radius: 16px;
        background: linear-gradient(145deg, #ff6675, #c91e39);
        color: white;
        font-weight: 900;
        letter-spacing: 0.1em;
        box-shadow: 0 9px 25px #9e122d55;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="camera"><div class="road"></div></div>
      <header>
        <div>
          <div class="brand">TRICK3</div>
          <div class="live"><span class="dot"></span>CONTROL LINK</div>
        </div>
        <label class="gear" for="settings-toggle" aria-label="相机设置"
          >⚙</label
        >
      </header>
      <input id="settings-toggle" type="checkbox" />
      <aside class="settings">
        <h2>相机基础设置</h2>
        <label class="field"
          ><span>分辨率</span
          ><select>
            <option>QVGA · 流畅</option>
            <option selected>VGA · 标准</option>
          </select></label
        >
        <label class="field"
          ><span>画质</span
          ><select>
            <option>流畅</option>
            <option selected>标准</option>
            <option>清晰</option>
          </select></label
        >
        <label class="field"
          ><span>补光灯</span><input type="range" min="0" max="255" value="35"
        /></label>
        <div class="field">
          <span>安装方向</span>
          <div class="switches">
            <button class="chip">水平镜像</button
            ><button class="chip">垂直翻转</button>
          </div>
        </div>
      </aside>
      <div class="joystick" aria-label="虚拟摇杆"><div class="knob"></div></div>
      <section class="telemetry">
        <div class="value">42%</div>
        <div class="unit">THROTTLE</div>
        <div class="steer">转向角<b>+08°</b></div>
      </section>
      <footer class="bottom">
        <div class="status">
          <strong>低延迟模式</strong>心跳 50 ms · 安全停车 200 ms
        </div>
        <button class="stop">STOP</button>
      </footer>
    </main>
  </body>
</html>
